<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동글사각 | CIRCLE SQUARE</title>
<link rel="icon" href="favicon.svg?v=7" type="image/svg+xml">
<!-- 링크 공유 미리보기. og:image 파일명은 optimize.sh가 최신 작품으로 갱신한다 -->
<meta name="description" content="세라믹 도자기 컨셉 디자인 갤러리">
<meta property="og:type" content="website">
<meta property="og:title" content="동글사각 | CIRCLE SQUARE">
<meta property="og:description" content="세라믹 도자기 컨셉 디자인 갤러리">
<meta property="og:url" content="https://suokkim.github.io/ceramic/">
<meta property="og:image" content="https://suokkim.github.io/ceramic/images/05_sculpture_04.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root { color-scheme: light; }
  * { margin: 0; box-sizing: border-box; }
  body {
    font-family: Georgia, "Apple SD Gothic Neo", serif;
    background: #d9d9d9;
    color: #3d3833;
    padding: 3rem 1.5rem;
  }
  header { max-width: 1100px; margin: 0 auto 3rem; text-align: left; }
  .grid {
    max-width: 1100px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 2rem;
  }
  .grid img {
    width: 100%; display: block; cursor: zoom-in;
    filter: brightness(.9); /* 대문에서만 화이트를 살짝 눌러줌, 원본은 그대로 */
    border-radius: 14px; border-top-right-radius: 0; /* 2시 방향만 각짐 */
  }
  footer {
    max-width: 1100px; margin: 4rem auto 0;
    text-align: right;
    font-family: "Helvetica Neue", "Apple SD Gothic Neo", "Pretendard", sans-serif;
    font-weight: 300;
    font-size: .68rem; color: #ededed; letter-spacing: .14em;
  }
  /* 확대 보기: <dialog> 대신 평범한 fixed div — 톱레이어·백드롭 등 iOS에서 검증 안 된
     동작을 전부 배제한다. 열려 있는 동안 뒤 페이지는 스크롤 잠금(JS에서 body fixed 병행). */
  html.locked { overflow: hidden; }
  #viewer {
    position: fixed; inset: 0; display: none;
    background: rgba(30,25,20,.85);
    overflow: hidden; overscroll-behavior: contain;
    z-index: 10;
  }
  #viewer.open { display: block; animation: fadeIn .32s ease; }
  /* 이미지는 배경보다 반 박자 늦게, 짧은 거리를 길게 감속하며 떠오른다.
     .pop = 가운데 장. 키프레임에 opacity 금지 — 애니메이션이 멈추면 backwards 채움
     탓에 투명하게 갇혀 이미지가 사라진다. */
  #viewer.open img.pop { animation: rise .55s .05s cubic-bezier(.16,1,.3,1) backwards; }
  @keyframes fadeIn { from { opacity: 0; } }
  @keyframes rise { from { transform: translateY(10px) scale(.985); } }
  @media (prefers-reduced-motion: reduce) {
    #viewer.open, #viewer.open img.pop { animation: none; }
  }
  /* 3장(이전·현재·다음)만 들고 transform으로 넘기는 페이저. 스크롤을 아예 쓰지 않는다 —
     iOS의 스크롤 스냅은 프로그램 스크롤 무시·재스냅·경계 고착 등 문제가 많아 전부 걷어냈다. */
  #track {
    display: flex; width: 100%; height: 100%;
    transform: translateX(-100%);
    touch-action: none; /* 제스처는 전부 JS가 처리, 배경은 어차피 잠겨 있다 */
  }
  #track > div { flex: 0 0 100%;
    display: flex; align-items: center; justify-content: center; }
  /* 슬라이드 기준 %라서 뷰포트 단위 오차를 타지 않는다 */
  #track img { max-width: 92%; max-height: 92%; display: block; cursor: zoom-out;
    border-radius: 14px; border-top-right-radius: 0;
    -webkit-user-drag: none; user-select: none; }
</style>
</head>
<body>
<header>
  <svg width="56" height="56" viewBox="0 0 56 56" aria-label="Ceramic">
    <!-- 블랙 사각형 + 회색 원 겹침 (스케치 참고), 외곽선 없음 -->
    <rect x="24" y="8" width="26" height="26" fill="#3a3a3a"/>
    <circle cx="24" cy="30" r="16" fill="#b5b5b5"/>
  </svg>
</header>
<div class="grid" id="grid"></div>
<div id="viewer" role="dialog" aria-modal="true"><div id="track"></div></div>
<footer>동글사각&ensp;|&ensp;CIRCLE SQUARE © 2026</footer>
<script>
const viewer = document.getElementById('viewer');
const track = document.getElementById('track');
let names = [], n = 0, cur = 0;   // cur = 지금 보이는 이미지 인덱스

const srcOf = name => 'images/' + name;
const altOf = name => name.split('?')[0].replace('.png', '');

// 슬라이드는 딱 3장: [이전, 현재, 다음]. 트랙은 늘 가운데(-100%)를 보여준다.
const slides = [0, 1, 2].map(() => {
  const div = document.createElement('div');
  div.appendChild(new Image());
  track.appendChild(div);
  return div.firstElementChild;
});
slides[1].classList.add('pop');   // 열림 애니메이션은 항상 가운데 장에만

// 현재 인덱스 기준으로 3장의 내용을 채운다
function show() {
  if (!n) return;
  [(cur - 1 + n) % n, cur, (cur + 1) % n].forEach((idx, j) => {
    const name = names[idx];
    if (slides[j].getAttribute('src') !== srcOf(name)) {
      slides[j].src = srcOf(name);
      slides[j].alt = altOf(name);
    }
  });
}

const setX = (px, animate) => {
  track.style.transition = animate ? 'transform .3s cubic-bezier(.2,.7,.3,1)' : 'none';
  track.style.transform = `translateX(calc(-100% + ${px}px))`;
};

// 진행 중인 전환을 "즉시 확정"한다. 모든 입력(터치 시작·넘김·열기)이 이걸 먼저 부르므로
// 상태가 꼬여도 다음 입력이 반드시 초기화한다 — 잠김 플래그가 없어서 먹통이 될 수 없다.
let pending = null;   // {dir, timer}
function commit() {
  if (!pending) return;
  clearTimeout(pending.timer);
  cur = ((cur + pending.dir) % n + n) % n;
  pending = null;
  show();
  setX(0, false);
}

// dir: -1 이전 / +1 다음 / 0 제자리 복귀. 확정은 transitionend가 아니라 타이머로 —
// transitionend는 유실될 수 있고(예전에 그걸로 뷰어가 영구히 잠겼다) 타이머는 반드시 돈다.
function slideTo(dir) {
  if (!n) return;
  commit();
  if (!dir || n < 2) { setX(0, true); return; }
  track.style.transition = 'transform .3s cubic-bezier(.2,.7,.3,1)';
  track.style.transform = `translateX(${-100 - dir * 100}%)`;
  pending = {dir, timer: setTimeout(commit, 320)};
}

fetch('images.json', {cache: 'no-store'}).then(r => r.json()).then(list => {
  names = list; n = list.length;
  const grid = document.getElementById('grid');
  list.forEach((name, i) => {
    const thumb = new Image();
    thumb.src = srcOf(name); thumb.alt = altOf(name); thumb.loading = 'lazy';
    thumb.onclick = () => openAt(i);
    grid.appendChild(thumb);
  });
});

// 배경 잠금. body position:fixed는 절대 금지 — iOS는 body가 큰 음수 top으로 고정되면
// 그 안의 fixed 요소를 화면에는 제대로 그리면서 터치 판정은 엉뚱한 위치로 하는 버그가
// 있어서, 이미지는 보이는데 아무 터치도 안 먹는 상태가 된다(페이지를 많이 내린 마지막
// 이미지일수록 심함). 잠금은 오버레이가 전 화면을 덮는 것 + 트랙의 touch-action:none이
// 네이티브 스크롤을 차단하는 것으로 충분하다.
// overflow:hidden이 걸리면 스크롤 위치가 0으로 리셋되므로 기억해뒀다 닫을 때 되돌린다.
let pageY = 0;
const lockPage = () => { pageY = scrollY; document.documentElement.classList.add('locked'); };
const unlockPage = () => { document.documentElement.classList.remove('locked'); scrollTo(0, pageY); };
const isOpen = () => viewer.classList.contains('open');
const closeViewer = () => { unlockPage(); viewer.classList.remove('open'); };

// 스크롤이 없으니 "열면 그 이미지"가 자명하다 — 위치 계산도, 고정도, 재정렬도 필요 없다.
function openAt(i) {
  commit();
  lockPage();
  cur = i;
  show();
  setX(0, false);
  viewer.classList.add('open');
}

// iOS 필수 한 줄: 문서 레벨 터치 리스너가 존재해야 iOS가 요소들에 터치를 제대로
// 전달한다(오래된 WebKit quirk). 이게 없으면 뷰어 스와이프가 실기기에서 죽는다 —
// ?debug 모드에서만 정상 동작했던 원인이 디버그가 문서 리스너를 달았기 때문이었다.
document.addEventListener('touchstart', () => {}, {passive: true});

// 제스처는 iOS에서 가장 오래 검증된 터치 이벤트로만. 포인터 캡처는 iOS에서 클릭·취소
// 동작이 불안정해 쓰지 않는다. 데스크톱 마우스는 아래에서 따로 처리.
let tx = 0, ty = 0, tdx = 0, tdrag = false;
track.addEventListener('touchstart', e => {
  commit();                       // 어떤 상태였든 여기서 리셋 — 먹통 원천 차단
  tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  tdx = 0; tdrag = false;
  track.style.transition = 'none';
}, {passive: true});
track.addEventListener('touchmove', e => {
  tdx = e.touches[0].clientX - tx;
  const dy = e.touches[0].clientY - ty;
  if (!tdrag && Math.abs(tdx) > 6 && Math.abs(tdx) > Math.abs(dy)) tdrag = true;
  if (tdrag) { e.preventDefault(); setX(tdx, false); }
}, {passive: false});
track.addEventListener('touchend', () => {
  if (!tdrag) return;             // 탭은 click 핸들러가 닫기로 처리
  slideTo(Math.abs(tdx) > Math.min(90, innerWidth / 5) ? (tdx < 0 ? 1 : -1) : 0);
}, {passive: true});
track.addEventListener('touchcancel', () => { if (tdrag) slideTo(0); }, {passive: true});

// 데스크톱 마우스 드래그
let mx = 0, mdx = 0, mdown = false, mdrag = false;
track.addEventListener('mousedown', e => {
  if (e.button) return;
  commit();
  mdown = true; mdrag = false; mdx = 0; mx = e.clientX;
  track.style.transition = 'none';
  e.preventDefault();             // 이미지 기본 드래그 방지
});
addEventListener('mousemove', e => {
  if (!mdown) return;
  mdx = e.clientX - mx;
  if (!mdrag && Math.abs(mdx) > 6) mdrag = true;
  if (mdrag) setX(mdx, false);
});
addEventListener('mouseup', () => {
  if (!mdown) return;
  mdown = false;
  if (mdrag) slideTo(Math.abs(mdx) > Math.min(90, innerWidth / 5) ? (mdx < 0 ? 1 : -1) : 0);
});

// 탭/클릭(드래그가 아니었을 때만) → 닫기
track.addEventListener('click', () => {
  if (tdrag || mdrag) { tdrag = mdrag = false; return; }
  closeViewer();
});

// 트랙패드 두 손가락 스와이프: 관성 이벤트가 계속 오므로 한 제스처당 한 번만
let wheelLock = false, wheelT = 0;
track.addEventListener('wheel', e => {
  if (Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
  e.preventDefault();
  clearTimeout(wheelT); wheelT = setTimeout(() => { wheelLock = false; }, 250);
  if (wheelLock || Math.abs(e.deltaX) < 25) return;
  wheelLock = true;
  slideTo(e.deltaX > 0 ? 1 : -1);
}, {passive: false});

document.onkeydown = e => {
  if (!isOpen()) return;
  if (e.key === 'Escape') { closeViewer(); return; }
  const dir = {ArrowLeft: -1, ArrowRight: 1}[e.key];
  if (dir) slideTo(dir);
};

</script>
</body>
</html>
