<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동글사각 | CIRCLE SQUARE</title>
<link rel="icon" href="favicon.svg?v=7" type="image/svg+xml">
<style>
  :root { color-scheme: light; }
  * { margin: 0; box-sizing: border-box; }
  body {
    font-family: Georgia, "Apple SD Gothic Neo", serif;
    background: #d9d9d9;
    color: #3d3833;
    padding: 3rem 1.5rem;
  }
  header { max-width: 1100px; margin: 0 auto 3rem; text-align: left; }
  .grid {
    max-width: 1100px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 2rem;
  }
  .grid img {
    width: 100%; display: block; cursor: zoom-in;
    filter: brightness(.9); /* 대문에서만 화이트를 살짝 눌러줌, 원본은 그대로 */
    border-radius: 14px; border-top-right-radius: 0; /* 2시 방향만 각짐 */
  }
  footer {
    max-width: 1100px; margin: 4rem auto 0;
    text-align: right;
    font-family: "Helvetica Neue", "Apple SD Gothic Neo", "Pretendard", sans-serif;
    font-weight: 300;
    font-size: .68rem; color: #ededed; letter-spacing: .14em;
  }
  /* 확대 보기: 화면 전체를 덮고, 열려 있는 동안 뒤 페이지는 스크롤 잠금 */
  html:has(dialog[open]) { overflow: hidden; }
  dialog {
    border: none; outline: none; padding: 0; margin: 0; background: transparent;
    width: 100vw; height: 100dvh; max-width: none; max-height: none;
    overflow: hidden; overscroll-behavior: contain;
  }
  dialog::backdrop { background: rgba(30,25,20,.85); }
  /* 이전·현재·다음 3장을 가로로 두고 트랙을 밀어서 넘긴다 */
  #track { display: flex; width: 100%; height: 100%; touch-action: pan-y; user-select: none; }
  #track > div { flex: 0 0 100%; display: flex; align-items: center; justify-content: center; }
  #track img { max-width: 92vw; max-height: 92dvh; display: block; cursor: zoom-out;
    border-radius: 14px; border-top-right-radius: 0;
    -webkit-user-drag: none; /* 마우스로 끌 때 브라우저 기본 이미지 드래그가 가로채지 않게 */ }
</style>
</head>
<body>
<header>
  <svg width="56" height="56" viewBox="0 0 56 56" aria-label="Ceramic">
    <!-- 블랙 사각형 + 회색 원 겹침 (스케치 참고), 외곽선 없음 -->
    <rect x="24" y="8" width="26" height="26" fill="#3a3a3a"/>
    <circle cx="24" cy="30" r="16" fill="#b5b5b5"/>
  </svg>
</header>
<div class="grid" id="grid"></div>
<dialog id="viewer">
  <div id="track"><div><img alt=""></div><div><img alt=""></div><div><img alt=""></div></div>
</dialog>
<footer>동글사각&ensp;|&ensp;CIRCLE SQUARE © 2026</footer>
<script>
const viewer = document.getElementById('viewer');
const track = document.getElementById('track');
const slides = [...track.querySelectorAll('img')];  // [이전, 현재, 다음]
let srcs = [], alts = [], idx = 0, pending = 0;

const at = i => (i + srcs.length) % srcs.length;

// 3장을 채우고 트랙을 가운데(-100%)로 되돌린다. 애니메이션 없이 즉시.
function render() {
  slides.forEach((img, k) => { const j = at(idx + k - 1); img.src = srcs[j]; img.alt = alts[j]; });
  track.style.transition = 'none';
  track.style.transform = 'translateX(-100%)';
}

// dir: -1 이전 / +1 다음 / 0 제자리 복귀. 애니메이션이 끝난 뒤에 idx를 확정한다.
function slideTo(dir) {
  if (pending) return;
  pending = dir;
  track.style.transition = 'transform .25s ease-out';
  track.style.transform = `translateX(${-100 - dir * 100}%)`;
}
track.addEventListener('transitionend', () => {
  if (!pending) return;
  idx = at(idx + pending);
  pending = 0;
  render();
});

fetch('images.json', {cache: 'no-store'}).then(r => r.json()).then(names => {
  const grid = document.getElementById('grid');
  srcs = names.map(n => 'images/' + n);
  alts = names.map(n => n.split('?')[0].replace('.png', ''));
  names.forEach((name, i) => {
    const img = new Image();
    img.src = srcs[i];
    img.alt = alts[i];
    img.loading = 'lazy';
    img.onclick = () => { idx = i; render(); viewer.showModal(); };
    grid.appendChild(img);
  });
});

viewer.onclick = () => { if (!dragging) viewer.close(); dragging = false; };
document.onkeydown = e => {
  if (!viewer.open) return;
  if (e.key === 'ArrowLeft') slideTo(-1);
  if (e.key === 'ArrowRight') slideTo(1);
};

// 드래그: 손가락/마우스를 그대로 따라가고, 놓을 때 화면 1/5 이상 넘겼으면 이동, 아니면 제자리.
// 포인터 이벤트라 터치·마우스가 한 코드로 처리된다.
let x0 = 0, y0 = 0, dx = 0, down = false, dragging = false;
track.addEventListener('pointerdown', e => {
  if (pending || e.button) return;
  down = true; dragging = false; dx = 0;
  x0 = e.clientX; y0 = e.clientY;
  track.style.transition = 'none';
});
track.addEventListener('pointermove', e => {
  if (!down || pending) return;
  dx = e.clientX - x0;
  if (!dragging && Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(e.clientY - y0)) {
    dragging = true;
    track.setPointerCapture(e.pointerId);
  }
  if (dragging) track.style.transform = `translateX(calc(-100% + ${dx}px))`;
});
const endDrag = () => {
  if (!down) return;
  down = false;
  if (dragging) slideTo(Math.abs(dx) > innerWidth / 5 ? (dx < 0 ? 1 : -1) : 0);
};
track.addEventListener('pointerup', endDrag);
track.addEventListener('pointercancel', endDrag);

// 트랙패드 두 손가락 가로 스와이프. 관성 스크롤이 계속 이벤트를 뿜으므로
// 한 제스처당 한 번만 넘기도록 잠갔다가, 이벤트가 200ms 멎으면 푼다.
let wheelLock = false, wheelTimer = 0;
track.addEventListener('wheel', e => {
  if (Math.abs(e.deltaX) < Math.abs(e.deltaY)) return;
  e.preventDefault();
  clearTimeout(wheelTimer);
  wheelTimer = setTimeout(() => { wheelLock = false; }, 200);
  if (wheelLock || Math.abs(e.deltaX) < 20) return;
  wheelLock = true;
  slideTo(e.deltaX > 0 ? 1 : -1);
}, {passive: false});
</script>
</body>
</html>
