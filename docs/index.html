<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동글사각 | CIRCLE SQUARE</title>
<link rel="icon" href="favicon.svg?v=8" type="image/svg+xml">
<!-- iOS 사파리는 SVG 파비콘을 안 읽는다. 홈 화면·탭 아이콘은 이 PNG만 본다.
     링크 태그가 필수 — 사이트가 /ceramic/ 하위라서, 태그가 없으면 iOS는 도메인
     루트(suokkim.github.io/apple-touch-icon.png)를 찾다 못 찾고 만다 -->
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=8">
<!-- 링크 공유 미리보기. og:image 파일명은 optimize.sh가 최신 작품으로 갱신한다 -->
<meta name="description" content="세라믹 도자기 컨셉 디자인 갤러리">
<meta property="og:type" content="website">
<meta property="og:title" content="동글사각 | CIRCLE SQUARE">
<meta property="og:description" content="세라믹 도자기 컨셉 디자인 갤러리">
<meta property="og:url" content="https://suokkim.github.io/ceramic/">
<meta property="og:image" content="https://suokkim.github.io/ceramic/images/41.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root { color-scheme: light; }
  * { margin: 0; box-sizing: border-box;
    -webkit-tap-highlight-color: transparent; /* iOS가 탭한 요소에 어두운 상자를 깜빡이는 것 제거 */ }
  body {
    font-family: Georgia, "Apple SD Gothic Neo", serif;
    background: #d9d9d9;
    color: #3d3833;
    padding: 0 1.5rem 3rem;  /* 위쪽 여백은 sticky 헤더의 padding이 담당 */
    /* 내용이 짧아도(모아보기 등) 푸터가 화면 위로 떠오르지 않게 최소 화면 높이 확보 */
    display: flex; flex-direction: column; min-height: 100dvh;
  }
  /* body가 플렉스라서 width:100%를 명시해야 한다 — 플렉스에서 margin:0 auto가 걸리면
     stretch가 꺼져 내용물 크기로 쪼그라들고, 모바일에서 레이아웃이 통째로 무너진다 */
  header { width: 100%; max-width: 1100px; margin: 0 auto 2rem;
    display: flex; justify-content: space-between; align-items: center;
    /* 스크롤해도 상단 고정, 배경은 투명 — 아이콘만 보인다.
       그리드가 z-index 1로 위에 있어 스크롤로 올라오는 작품 이미지가 아이콘을
       자연스럽게 덮고 지나간다. 헤더 쪽을 음수 z-index로 내리면 iOS에서 터치가
       통과돼 아이콘이 안 눌린다 — 반드시 그리드를 올리는 방식으로 할 것.
       투명 헤더 띠가 밑 썸네일 클릭을 막지 않게 헤더는 클릭을 통과시키고
       아이콘 두 개만 다시 받는다. */
    position: sticky; top: 0; padding: 3rem 0 1rem; pointer-events: none; }
  header label { pointer-events: auto; }
  /* 상단 아이콘이 이미지에 완전히 덮인 뒤(JS가 헤더 높이로 판정) 화면 아래쪽에서
     천천히 떠오른다(페이드 인). transform이라 레이아웃엔 영향이 없어 그리드가 튀지
     않고, 아래에서는 그림 위(z-index 5)라 터치도 잘 된다. viewer(10)보다는 아래.
     맨 위로 돌아가면 원래 자리(상단)로 복귀. */
  header.scrolled { transform: translateY(calc(100dvh - 100%));
    z-index: 5; animation: fadeIn .8s ease; }
  /* iOS 햅틱 편법: 아이폰 사파리는 Vibration API가 없지만, 사용자가 직접 탭해서
     <input type="checkbox" switch>가 토글되면 시스템 햅틱이 울린다(iOS 17.4+).
     그래서 탭 대상을 label로 만들어 이 숨은 스위치를 건드리게 한다. 실제 탭에만
     반응하므로 스와이프에는 못 쓴다. 화면에서 지우되(opacity) 렌더는 유지할 것 —
     display:none이면 토글이 안 일어나 햅틱도 없다.
     fixed인 이유: label 활성화는 스위치에 포커스를 주는데, 화면 밖에 있으면 브라우저가
     거기로 스크롤해버린다. 항상 뷰포트 안에 있으면 그 점프가 원천 차단된다. */
  #hap { position: fixed; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  #logoBtn { display: flex; cursor: pointer; }
  #gridToggle {
    display: inline-flex; cursor: pointer;
    /* 44px 탭 영역(애플 권장 최소). 음수 마진으로 상쇄해 헤더 정렬은 그대로 둔다 */
    padding: 13px; margin: -13px;
    /* 밝은 그레이(디자인 선택). 배경 대비 2.19:1로 UI 컴포넌트 권장선 3:1 아래다 —
       의도된 값이니 되돌리지 말 것. 다만 #b3afa9(1.55:1) 아래로는 내리지 말 것:
       그 값에서 폰 화면으로는 아이콘이 사실상 안 보였다(터치 기기엔 hover 단서도 없음) */
    color: #989289;
    line-height: 0;
  }
  /* :hover 상태색은 두지 않는다 — 터치 기기는 탭하면 hover가 걸린 채로 남아서
     다른 곳을 누를 때까지 색이 달라 보인다(아이콘이 두 가지 색으로 보이던 원인).
     되살릴 거면 반드시 @media (hover: hover)로 감쌀 것. */
  .grid {
    width: 100%; max-width: 1100px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 2rem;
    z-index: 1;  /* 상단 고정 헤더(아이콘) 위로 지나가게. body가 flex라 position 불필요 */
  }
  .grid img {
    width: 100%; display: block; cursor: zoom-in;
    /* 원본이 전부 A4 300dpi(2480x3508)라 비율이 고정. 이미지가 도착하기 전에
       자리를 미리 잡아줘서 로딩 중 스크롤이 튀지 않는다 */
    aspect-ratio: 2480 / 3508;
    /* 배경 화이트 톤은 썸네일 파일에 미리 구워져 있다(tools/tone.mjs) — 예전엔
       CSS SVG 필터(dimWhite)로 실시간 적용했는데 장수가 늘며 스크롤 GPU 부담이
       커져서 파일로 옮겼다. 커브를 바꾸려면 tone.mjs 수정 후 썸네일 재생성. */
    border-radius: 14px; border-top-right-radius: 0; /* 2시 방향만 각짐 */
  }
  /* 모아보기: 인스타그램식 3열 정사각 그리드. 전체 톤의 통일성을 한눈에 보는 용도.
     모바일(1열)에서 특히 유효하지만 데스크톱에서도 동작한다. */
  .grid.compact { grid-template-columns: repeat(var(--cols, 3), 1fr); gap: 2px; }
  .grid.compact img { aspect-ratio: 1; object-fit: cover; border-radius: 0; }
  /* 실루엣 겹층(JS가 flood fill로 생성). 열 수에 비례해 --sil로 원본 위에 떠오른다 */
  .grid .cell { position: relative; }
  .grid .sil {
    position: absolute; inset: 0; height: 100%;
    pointer-events: none; opacity: var(--sil, 0);
    transition: opacity .3s;  /* 로고로 실루엣 모드 전환 시 화면 전체가 번쩍이지 않게 */
  }
  /* 실루엣 모드(--sil:1)에서 새로고침하면 원본이 실루엣보다 먼저 도착해 한순간
     비친다. 실루엣이 로드될 때까지(.sil-ready 전) 원본을 실루엣 진하기만큼 숨겨서
     빈 칸→실루엣으로 바로 이어지게 한다. 입체 모드(--sil:0)에선 영향 없음. */
  .grid .cell:not(.sil-ready) img:not(.sil) { opacity: calc(1 - var(--sil, 0)); }
  footer {
    width: 100%; max-width: 1100px;
    margin: auto auto 0;      /* margin-top:auto = 내용이 짧으면 화면 맨 아래로 밀림 */
    padding-top: 4rem;        /* 내용이 길 때 그리드와의 최소 간격 */
    text-align: right;
    font-family: "Helvetica Neue", "Apple SD Gothic Neo", "Pretendard", sans-serif;
    font-weight: 300;
    font-size: .68rem; color: #ededed; letter-spacing: .14em;
  }
  /* 확대 보기: <dialog> 대신 평범한 fixed div — 톱레이어·백드롭 등 iOS에서 검증 안 된
     동작을 전부 배제한다. 열려 있는 동안 뒤 페이지는 스크롤 잠금(JS에서 body fixed 병행). */
  html.locked { overflow: hidden; }
  #viewer {
    position: fixed; inset: 0; display: none;
    background: rgba(30,25,20,.85);
    overflow: hidden; overscroll-behavior: contain;
    z-index: 10;
  }
  #viewer.open { display: block; animation: fadeIn .32s ease; }
  /* 이미지는 배경보다 반 박자 늦게, 짧은 거리를 길게 감속하며 떠오른다.
     .pop = 가운데 장. 키프레임에 opacity 금지 — 애니메이션이 멈추면 backwards 채움
     탓에 투명하게 갇혀 이미지가 사라진다. */
  #viewer.open img.pop { animation: rise .55s .05s cubic-bezier(.16,1,.3,1) backwards; }
  @keyframes fadeIn { from { opacity: 0; } }
  @keyframes rise { from { transform: translateY(10px) scale(.985); } }
  @media (prefers-reduced-motion: reduce) {
    #viewer.open, #viewer.open img.pop { animation: none; }
  }
  /* 3장(이전·현재·다음)만 들고 transform으로 넘기는 페이저. 스크롤을 아예 쓰지 않는다 —
     iOS의 스크롤 스냅은 프로그램 스크롤 무시·재스냅·경계 고착 등 문제가 많아 전부 걷어냈다.
     세로 스택(위아래 스와이프로 넘김) — 릴스처럼 위로 밀면 다음 장. */
  #track {
    display: flex; flex-direction: column; width: 100%; height: 100%;
    transform: translateY(-100%);
    touch-action: none; /* 제스처는 전부 JS가 처리, 배경은 어차피 잠겨 있다 */
  }
  #track > div { flex: 0 0 100%;
    display: flex; align-items: center; justify-content: center; }
  /* 슬라이드 기준 %라서 뷰포트 단위 오차를 타지 않는다 */
  #track img { max-width: 92%; max-height: 92%; display: block; cursor: zoom-out;
    border-radius: 14px; border-top-right-radius: 0;
    -webkit-user-drag: none; user-select: none; }
  /* 버전 점 표시: 버전이 여럿인 작품에서만 하단 중앙에 ● ○ ○ (좌우 스와이프로 넘김) */
  #vdots { position: absolute; left: 0; right: 0;
    bottom: max(1.2rem, env(safe-area-inset-bottom));
    display: flex; justify-content: center; gap: 7px; pointer-events: none; }
  #vdots i { width: 6px; height: 6px; border-radius: 50%; background: #fff; opacity: .3; }
  #vdots i.on { opacity: .9; }
</style>
</head>
<body>
<header>
  <!-- 아이폰 햅틱용 숨은 스위치. 아래 label 두 개가 이걸 토글해 진동을 일으킨다 -->
  <input type="checkbox" switch id="hap" tabindex="-1" aria-hidden="true">
  <label for="hap" id="logoBtn" aria-label="Ceramic">
    <svg id="logo" width="56" height="56" viewBox="0 0 56 56">
      <!-- 블랙 사각형 + 회색 원 겹침 (스케치 참고), 외곽선 없음. 클릭하면 앞뒤가 바뀐다.
           사각형이 뒤(마지막 = 앞에 그려짐)라 기본이 실루엣 모드다 — 큰 보기 기본값과 짝. -->
      <circle cx="24" cy="30" r="16" fill="#b5b5b5"/>
      <rect x="24" y="8" width="26" height="26" fill="#3a3a3a"/>
    </svg>
  </label>
  <!-- 아이콘은 setCols()가 그린다. 2단계 토글일 땐 아이콘 두 개를 CSS로 갈아끼웠지만,
       열이 3~10으로 순환하게 되면서 그 방식이 거짓말을 하게 됐다(3열인데 "큰 보기"
       사각형이 떠 있고 실제로 누르면 4열). 지금은 **다음에 누르면 갈 곳**을 그린다. -->
  <label for="hap" id="gridToggle" role="button" tabindex="0" aria-pressed="false" aria-label="모아보기">
    <svg id="toggleIcon" width="18" height="18" viewBox="0 0 18 18" fill="currentColor"></svg>
  </label>
</header>
<div class="grid" id="grid"></div>
<!-- label인 이유: 확대 화면 어디를 탭하든 #hap 스위치가 토글돼 아이폰 햅틱이 울린다 -->
<label for="hap" id="viewer" role="dialog" aria-modal="true"><div id="track"></div><div id="vdots"></div></label>
<footer>동글사각&ensp;|&ensp;CIRCLE SQUARE © 2026</footer>
<script>
const viewer = document.getElementById('viewer');
const track = document.getElementById('track');
// names = images.json 순서 그대로(최신순). 작품당 배열 [원작, v2, v3, …] —
// 첫 요소가 대표판(그리드·모아보기에 보이는 판), 나머지는 뷰어에서 좌우로만 보인다.
let names = [], n = 0, cur = 0;   // cur = 지금 보이는 작품 인덱스
let ver = 0;                      // 지금 보이는 버전 인덱스 (작품이 바뀌면 0으로)

const srcOf = name => 'images/' + name;
const altOf = name => name.split('?')[0].replace('.png', '');

// 슬라이드는 딱 3장: [이전, 현재, 다음]. 트랙은 늘 가운데(-100%)를 보여준다.
const slides = [0, 1, 2].map(() => {
  const div = document.createElement('div');
  div.appendChild(new Image());
  track.appendChild(div);
  return div.firstElementChild;
});
slides[1].classList.add('pop');   // 열림 애니메이션은 항상 가운데 장에만

// 현재 인덱스 기준으로 3장의 내용을 채운다. 가운데만 현재 버전, 위아래는 각 작품의 대표판.
function show() {
  if (!n) return;
  if (zoom > 1) resetZoom(false);   // 장이 바뀌면 확대 해제
  [(cur - 1 + n) % n, cur, (cur + 1) % n].forEach((idx, j) => {
    const name = j === 1 ? names[idx][ver] : names[idx][0];
    if (slides[j].getAttribute('src') !== srcOf(name)) {
      slides[j].src = srcOf(name);
      slides[j].alt = altOf(name);
    }
  });
  drawVer();
  // 이웃 버전 미리 데우기 — 좌우 스와이프 때 디코드 대기가 없도록
  const vs = names[cur];
  if (vs.length > 1) [ver + 1, ver - 1].forEach(k =>
    new Image().src = srcOf(vs[(k + vs.length) % vs.length]));
}

// 버전 점 표시: 버전이 있는 작품에서만 하단에 ● ○ ○
const vdots = document.getElementById('vdots');
function drawVer() {
  vdots.innerHTML = names[cur].length > 1
    ? names[cur].map((_, k) => `<i${k === ver ? ' class="on"' : ''}></i>`).join('') : '';
}

// 좌우 = 같은 작품의 버전 넘김. 나가는 쪽으로 밀어낸 뒤 새 버전을 디코드해
// 반대쪽에서 들여온다 — 디코드를 기다렸다 src를 바꾸므로 이전 그림이 안 비친다.
async function verTo(dir) {
  const vs = names[cur];
  const img = slides[1];
  // dir 0 = 제자리 복귀 (짧은 드래그·버전 없는 작품의 고무줄)
  if (!dir || vs.length < 2) { img.style.transition = EASE; img.style.transform = ''; return; }
  buzz();
  ver = (ver + dir + vs.length) % vs.length;
  img.style.transition = 'transform .2s ease';
  img.style.transform = `translateX(${-dir * innerWidth}px)`;
  const pre = new Image(); pre.src = srcOf(vs[ver]);
  try { await pre.decode(); } catch {}
  // 디코드를 기다리는 사이 작품이 넘어갔으면(슬라이드 회전) 여기서 손을 뗀다
  if (slides[1] !== img) { img.style.transform = ''; return; }
  img.src = pre.src; img.alt = altOf(vs[ver]);
  img.style.transition = 'none';
  img.style.transform = `translateX(${dir * innerWidth}px)`;
  img.getBoundingClientRect();   // 위치를 강제 확정해야 다음 transition이 먹는다
  img.style.transition = EASE;
  img.style.transform = '';
  drawVer();
}

// 넘김 전환: 시작은 손가락 속도를 이어받아 빠르게, 끝은 길게 미끄러지며 안착(easeOutExpo).
// 짧고 끝이 급한 곡선은 "턱 하고 서는" 느낌을 준다.
const EASE = 'transform .7s cubic-bezier(.22,1,.36,1)';
const FADE = 'filter .7s cubic-bezier(.22,1,.36,1)';
const DIM = .25;   // 화면 밖 장의 기본 밝기 — 나가는 장이 어둡게 눌리며 물러나게

// 나가는 장만 이동량에 비례해 어둡게 눌리고(밝기 조절 — 투명도를 쓰면 뒤 페이지가
// 비쳐 보인다), 들어오는 장은 방향과 무관하게 처음부터 제 밝기로 들어온다.
const setFade = (vals, animate) => {
  [...track.children].forEach((d, j) => {
    d.style.transition = animate ? FADE : 'none';
    d.style.filter = `brightness(${vals[j]})`;
  });
};
const setY = (px, animate) => {
  track.style.transition = animate ? EASE : 'none';
  track.style.transform = `translateY(calc(-100% + ${px}px))`;
  const p = Math.min(1, Math.abs(px) / innerHeight);
  setFade([px > 0 ? 1 : DIM,
           1 - (1 - DIM) * p,
           px < 0 ? 1 : DIM], animate);
};

// 진행 중인 전환을 "즉시 확정"한다. 모든 입력(터치 시작·넘김·열기)이 이걸 먼저 부르므로
// 상태가 꼬여도 다음 입력이 반드시 초기화한다 — 잠김 플래그가 없어서 먹통이 될 수 없다.
let pending = null;   // {dir, timer}
function commit() {
  if (!pending) return;
  const dir = pending.dir;
  clearTimeout(pending.timer);
  cur = ((cur + dir) % n + n) % n;
  ver = 0;   // 작품이 바뀌면 항상 대표판(원작)부터
  pending = null;
  // 슬라이드 DOM을 실제로 회전 — 방금 화면에 들어온 장이 그대로 가운데가 된다.
  // 가운데 장의 src를 갈아끼우면 새 그림이 디코딩되기 전 한 프레임 동안 이전
  // 그림이 비쳐 보였다(스와이프 직후 번쩍임). 새 src는 화면 밖 가장자리 장만 받는다.
  if (dir === 1) { track.appendChild(track.firstElementChild); slides.push(slides.shift()); }
  if (dir === -1) { track.prepend(track.lastElementChild); slides.unshift(slides.pop()); }
  // 여기서 .pop을 붙이면 안 된다 — 뷰어가 열린 채라 열림 애니메이션이 즉시 재생돼
  // 그림이 어긋났다 제자리로 가는 것처럼 보인다. .pop은 openAt에서만 단다.
  slides.forEach(s => s.classList.remove('pop'));
  show();
  setY(0, false);
}

// 탭 햅틱. Android/데스크톱 크롬만 실제로 울린다 — iOS 사파리는 Vibration API 미지원이라
// 조용히 무시된다(?.로 호출해 에러도 안 난다). 사용자가 진동을 꺼둔 경우도 마찬가지.
const buzz = (ms = 4) => navigator.vibrate?.(ms);

// dir: -1 이전 / +1 다음 / 0 제자리 복귀. 확정은 transitionend가 아니라 타이머로 —
// transitionend는 유실될 수 있고(예전에 그걸로 뷰어가 영구히 잠겼다) 타이머는 반드시 돈다.
function slideTo(dir) {
  if (!n) return;
  commit();
  if (!dir || n < 2) { setY(0, true); return; }
  buzz();                           // 넘김이 확정될 때만 — 제자리 복귀는 조용히
  track.style.transition = EASE;
  track.style.transform = `translateY(${-100 - dir * 100}%)`;
  setFade(dir > 0 ? [DIM, DIM, 1] : [1, DIM, DIM], true);
  pending = {dir, timer: setTimeout(commit, 720)};
}

// 그리드는 names 순서 그대로 그린다. 확대 보기도 같은 names를 보므로 화면 순서와
// 스와이프 순서가 절대 어긋나지 않는다 — 섞을 때 DOM만 뒤집으면 여기가 깨진다.
// 대문은 절대 원본을 받지 않는다. 원본은 뷰어에서 열 때만 — 개수가 늘어도 첫 로딩이
// 무거워지지 않는 유일한 지점이다. 썸네일은 두 종류:
//   sq/ 240x240  모아보기용 정사각 크롭
//   th/ 424x600  큰 보기용. 세로 비율이 필요해 정사각을 못 쓴다.
// images.json은 작품 이름(NN.png?v=…)을 들고 있으므로 확장자만 바꾼다 — ?v= 캐시
// 무효화가 그대로 붙어서, 그림을 고치면 썸네일 캐시도 같이 갱신된다.
const SQ_PX = 240;   // sq 변형의 한 변

// 어느 쪽을 받을지는 폰/데스크톱이 아니라 **지금 칸이 실제로 몇 픽셀인지**로 정한다.
// 기기로 나누면 데스크톱 10열(칸 108px = 레티나 216px)처럼 작은 경우를 놓쳐
// 424px짜리를 헛되이 받는다. 그리드 폭은 재서 얻는다 — CSS의 max-width·padding을
// JS에 복제하면 한쪽만 고쳤을 때 조용히 어긋난다. gap(2px)만 여기 적혀 있다.
function cellPx() {
  const w = document.getElementById('grid').getBoundingClientRect().width;
  return cols > 0 ? (w - 2 * (cols - 1)) / cols : w;
}
const useSq = () => isCompact() && cellPx() * (devicePixelRatio || 1) <= SQ_PX;
const thumbSrc = name =>
  (useSq() ? 'images/sq/' : 'images/th/') + name.replace('.png', '.jpg');

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.replaceChildren();
  names.forEach((work, i) => {
    const name = work[0];   // 그리드는 항상 대표판(원작)만
    const thumb = new Image();
    thumb.src = thumbSrc(name);
    thumb.alt = altOf(name); thumb.loading = 'lazy';
    thumb.onclick = () => openAt(i);
    // 실루엣은 원본 썸네일 위에 겹치는 별도 층 — 진하기는 --sil이 조절한다.
    // 브라우저에서 계산하지 않는다: optimize.sh가 silhouette.mjs로 1600px 원본에서
    // 미리 만들어 둔 images/si/NN.svg를 그냥 얹는다(같은 ?v=라 캐시도 함께 갱신).
    // SVG(윤곽 폴리곤)라 칸이 아무리 작아도 매끈하다.
    // 원본과 같은 비율(viewBox) + 같은 object-fit:cover라 크롭이 정확히 겹친다.
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.appendChild(thumb);
    // 큰 보기에서도 항상 깐다 — 로고 실루엣 모드(--sil:1)가 언제든 켜질 수 있으므로.
    const sil = new Image();
    sil.className = 'sil'; sil.alt = ''; sil.loading = 'lazy';
    // 로드 완료 표시 — CSS가 이 전까지 원본을 숨겨 실루엣 모드 새로고침 번쩍임 방지.
    // 실패(404)해도 표시해서 원본이 영영 안 보이는 일은 없게.
    sil.onload = sil.onerror = () => cell.classList.add('sil-ready');
    sil.src = 'images/si/' + name.replace('.png', '.svg');
    cell.appendChild(sil);
    // 썸네일도 label로 감싸야 아이폰에서 진동한다. display:contents라 그리드 배치는
    // cell이 담당하고 CSS는 손댈 게 없다.
    const tap = document.createElement('label');
    tap.htmlFor = 'hap'; tap.style.display = 'contents';
    tap.appendChild(cell);
    grid.appendChild(tap);
  });
}

const isCompact = () => document.getElementById('grid').classList.contains('compact');

fetch('images.json', {cache: 'no-store'}).then(r => r.json()).then(list => {
  names = list; n = list.length;
  renderGrid();
});

// 배경 잠금. body position:fixed는 절대 금지 — iOS는 body가 큰 음수 top으로 고정되면
// 그 안의 fixed 요소를 화면에는 제대로 그리면서 터치 판정은 엉뚱한 위치로 하는 버그가
// 있어서, 이미지는 보이는데 아무 터치도 안 먹는 상태가 된다(페이지를 많이 내린 마지막
// 이미지일수록 심함). 잠금은 오버레이가 전 화면을 덮는 것 + 트랙의 touch-action:none이
// 네이티브 스크롤을 차단하는 것으로 충분하다.
// overflow:hidden이 걸리면 스크롤 위치가 0으로 리셋되므로 기억해뒀다 닫을 때 되돌린다.
let pageY = 0;
const lockPage = () => { pageY = scrollY; document.documentElement.classList.add('locked'); };
const unlockPage = () => { document.documentElement.classList.remove('locked'); scrollTo(0, pageY); };
const isOpen = () => viewer.classList.contains('open');
const closeViewer = () => { unlockPage(); viewer.classList.remove('open'); };

// 스크롤이 없으니 "열면 그 이미지"가 자명하다 — 위치 계산도, 고정도, 재정렬도 필요 없다.
function openAt(i) {
  buzz();
  commit();
  lockPage();
  cur = i; ver = 0;
  show();
  setY(0, false);
  slides[1].classList.add('pop');  // 열림 애니메이션은 가운데 장에만
  viewer.classList.add('open');
}

// iOS 필수 한 줄: 문서 레벨 터치 리스너가 존재해야 iOS가 요소들에 터치를 제대로
// 전달한다(오래된 WebKit quirk). 이게 없으면 뷰어 스와이프가 실기기에서 죽는다 —
// ?debug 모드에서만 정상 동작했던 원인이 디버그가 문서 리스너를 달았기 때문이었다.
document.addEventListener('touchstart', () => {}, {passive: true});

// 핀치 확대: 가운데 장에 transform 하나만 얹는다. 두 손가락 벌리면 확대(1~5배),
// 확대 중엔 한 손가락이 패닝(장 넘김 대신), 탭 한 번이 원래 크기 복귀.
// 배율이 1로 돌아오면 스와이프 모드로 자동 복귀. 장이 바뀌면(show) 리셋.
// ponytail: 확대 중심은 손가락 중점이 아니라 이미지 중앙 — 중점 이동으로 따라가므로
// 실사용엔 충분하다. 손가락 기준 정밀 앵커가 필요해지면 그때 행렬 계산 추가.
let zoom = 1, zx = 0, zy = 0, pinch = null, panX0 = 0, panY0 = 0, justPinched = false;
function applyZoom(animate) {
  slides[1].style.transition = animate ? 'transform .25s ease' : 'none';
  slides[1].style.transform = zoom > 1 ? `translate(${zx}px, ${zy}px) scale(${zoom})` : '';
}
function resetZoom(animate) { zoom = 1; zx = zy = 0; pinch = null; applyZoom(animate); }
const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);

// 제스처는 iOS에서 가장 오래 검증된 터치 이벤트로만. 포인터 캡처는 iOS에서 클릭·취소
// 동작이 불안정해 쓰지 않는다. 데스크톱 마우스는 아래에서 따로 처리.
let tx = 0, ty = 0, tdx = 0, tdy = 0, tdrag = false, hdrag = false;
track.addEventListener('touchstart', e => {
  if (e.touches.length >= 2) {    // 두 손가락 = 핀치 시작. 스와이프 판정은 버린다
    pinch = { d0: dist(e.touches), z0: zoom,
              x0: (e.touches[0].clientX + e.touches[1].clientX) / 2,
              y0: (e.touches[0].clientY + e.touches[1].clientY) / 2,
              zx0: zx, zy0: zy };
    tdrag = false;
    return;
  }
  commit();                       // 어떤 상태였든 여기서 리셋 — 먹통 원천 차단
  tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  panX0 = zx; panY0 = zy;
  tdx = tdy = 0; tdrag = hdrag = false;
  track.style.transition = 'none';
}, {passive: true});
track.addEventListener('touchmove', e => {
  if (pinch && e.touches.length >= 2) {
    e.preventDefault();
    zoom = Math.min(5, Math.max(1, pinch.z0 * dist(e.touches) / pinch.d0));
    zx = pinch.zx0 + (e.touches[0].clientX + e.touches[1].clientX) / 2 - pinch.x0;
    zy = pinch.zy0 + (e.touches[0].clientY + e.touches[1].clientY) / 2 - pinch.y0;
    applyZoom(false);
    return;
  }
  if (zoom > 1) {                 // 확대 중 한 손가락 = 패닝
    e.preventDefault();
    zx = panX0 + e.touches[0].clientX - tx;
    zy = panY0 + e.touches[0].clientY - ty;
    applyZoom(false);
    return;
  }
  tdy = e.touches[0].clientY - ty;
  tdx = e.touches[0].clientX - tx;
  // 먼저 6px를 넘는 순간 축을 확정 — 세로 = 작품 넘김, 가로 = 버전 넘김
  if (!tdrag && !hdrag && (Math.abs(tdy) > 6 || Math.abs(tdx) > 6)) {
    if (Math.abs(tdy) >= Math.abs(tdx)) tdrag = true; else hdrag = true;
  }
  if (tdrag) { e.preventDefault(); setY(tdy, false); }
  if (hdrag) {
    e.preventDefault();
    // 버전이 없으면 1/4만 따라오는 고무줄 — 끌리는 감으로 "여긴 없다"를 알린다
    slides[1].style.transition = 'none';
    slides[1].style.transform = `translateX(${names[cur].length > 1 ? tdx : tdx / 4}px)`;
  }
}, {passive: false});
// 넘김 확정 기준: 화면 높이의 18% (데스크톱은 110px 상한). 35%는 끌어야 하는 거리가
// 너무 길었다 — 짧게 밀어도 넘어가되, 6px 드래그 판정이 있어 탭과는 안 섞인다.
const THRESHOLD = () => Math.min(110, innerHeight * .18);
track.addEventListener('touchend', e => {
  if (pinch) {
    justPinched = true;           // 손을 떼며 생기는 click이 뷰어를 닫지 않게
    if (zoom <= 1.05) resetZoom(true);
    pinch = null;
    if (e.touches.length === 1) { // 남은 한 손가락은 패닝으로 이어받는다
      tx = e.touches[0].clientX; ty = e.touches[0].clientY;
      panX0 = zx; panY0 = zy;
    }
    return;
  }
  if (zoom > 1) return;           // 패닝 종료 — 넘김 아님
  if (hdrag) { verTo(Math.abs(tdx) > THRESHOLD() ? (tdx < 0 ? 1 : -1) : 0); return; }
  if (!tdrag) return;             // 탭은 click 핸들러가 닫기로 처리
  slideTo(Math.abs(tdy) > THRESHOLD() ? (tdy < 0 ? 1 : -1) : 0);
}, {passive: true});
track.addEventListener('touchcancel', () => {
  pinch = null;
  if (tdrag) slideTo(0);
  if (hdrag) verTo(0);
}, {passive: true});

// 데스크톱 마우스 드래그 — 터치와 같은 축 규칙: 세로 = 작품, 가로 = 버전
let mx = 0, my = 0, mdx = 0, mdy = 0, mdown = false, mdrag = false, hmdrag = false;
track.addEventListener('mousedown', e => {
  if (e.button) return;
  commit();
  mdown = true; mdrag = hmdrag = false; mdx = mdy = 0; mx = e.clientX; my = e.clientY;
  track.style.transition = 'none';
  e.preventDefault();             // 이미지 기본 드래그 방지
});
addEventListener('mousemove', e => {
  if (!mdown) return;
  mdx = e.clientX - mx; mdy = e.clientY - my;
  if (!mdrag && !hmdrag && (Math.abs(mdy) > 6 || Math.abs(mdx) > 6)) {
    if (Math.abs(mdy) >= Math.abs(mdx)) mdrag = true; else hmdrag = true;
  }
  if (mdrag) setY(mdy, false);
  if (hmdrag) {
    slides[1].style.transition = 'none';
    slides[1].style.transform = `translateX(${names[cur].length > 1 ? mdx : mdx / 4}px)`;
  }
});
addEventListener('mouseup', () => {
  if (!mdown) return;
  mdown = false;
  if (mdrag) slideTo(Math.abs(mdy) > THRESHOLD() ? (mdy < 0 ? 1 : -1) : 0);
  if (hmdrag) verTo(Math.abs(mdx) > THRESHOLD() ? (mdx < 0 ? 1 : -1) : 0);
});

// 탭/클릭(드래그·핀치가 아니었을 때만) → 확대 중이면 원래 크기로, 아니면 닫기
track.addEventListener('click', () => {
  if (tdrag || hdrag || mdrag || hmdrag || justPinched) { tdrag = hdrag = mdrag = hmdrag = justPinched = false; return; }
  buzz();
  if (zoom > 1) { resetZoom(true); return; }
  closeViewer();
});

// 트랙패드 두 손가락 스와이프(세로): 관성 이벤트가 계속 오므로 한 제스처당 한 번만
let wheelLock = false, wheelT = 0;
track.addEventListener('wheel', e => {
  // 트랙패드 핀치는 ctrlKey 달린 wheel로 온다 — 페이지 줌 대신 이미지 줌
  if (e.ctrlKey) {
    e.preventDefault();
    zoom = Math.min(5, Math.max(1, zoom - e.deltaY * .02));
    if (zoom === 1) zx = zy = 0;
    applyZoom(false);
    return;
  }
  // 세로 = 작품 넘김, 가로 = 버전 넘김 (터치 축과 동일)
  const horiz = Math.abs(e.deltaX) > Math.abs(e.deltaY);
  const d = horiz ? e.deltaX : e.deltaY;
  e.preventDefault();
  clearTimeout(wheelT); wheelT = setTimeout(() => { wheelLock = false; }, 250);
  if (wheelLock || Math.abs(d) < 25) return;
  wheelLock = true;
  horiz ? verTo(d > 0 ? 1 : -1) : slideTo(d > 0 ? 1 : -1);
}, {passive: false});

// 로고 인터랙션: 누를 때마다 원↔사각형 앞뒤가 바뀐다 — 이 앞뒤가 곧 모드다:
// 사각형이 앞 = 실루엣 보기, 원이 앞 = 입체(원본) 보기. 큰 보기·모아보기 공통.
// SVG는 문서 순서대로 그리므로, 맨 앞 요소를 맨 뒤로 옮기면 앞뒤가 뒤집힌다.
const squareFront = () => document.getElementById('logo').lastElementChild.tagName === 'rect';
document.getElementById('logoBtn').onclick = () => {
  buzz();
  const svg = document.getElementById('logo');
  svg.appendChild(svg.firstElementChild);
  setCols(cols);   // 뷰는 유지, --sil(실루엣↔입체)만 갱신
};

// 모아보기 토글. 상태는 열 수 하나로 표현한다: 0 = 큰 보기, 3~8 = 모아보기 열 수.
// 누를 때마다 0 → 3 → 4 → … → 8 → 0 으로 한 바퀴 돈다.
const MIN_COLS = 3, MAX_COLS = 8;
const gridEl = document.getElementById('grid');
const toggleBtn = document.getElementById('gridToggle');
const toggleIcon = document.getElementById('toggleIcon');
let cols = 0;

// 다음에 누르면 갈 상태
const nextOf = c => c === 0 ? MIN_COLS : c === MAX_COLS ? 0 : c + 1;

// 큰 보기 아이콘: 이미지와 같은 실루엣 — 2시(오른쪽 위)만 90도로 각지고 나머지 세
// 모서리는 라운드. 각진 모서리(18,0)에서 시계 방향으로 돌며 4·8·10시에 반지름 4 arc.
const BIG_PATH = 'M18 0 v14 a4 4 0 0 1 -4 4 h-10 a4 4 0 0 1 -4 -4 v-10 a4 4 0 0 1 4 -4 z';

// 큰 보기 = 3×3 점 격자(모아보기로 가는 버튼), 모아보기 3~8열 = 사각형 안에
// 현재 열 수 숫자(지금 몇 열인지 보여준다).
function drawToggleIcon(c) {
  if (c === 0) {
    // 점:간격 10:3 (예전 3열 아이콘과 동일: 5px 점, 1.5px 간격)
    const d = 18 / (1.3 * 3 - 0.3), step = d * 1.3;
    let s = '';
    for (let y = 0; y < 3; y++)
      for (let x = 0; x < 3; x++)
        s += `<rect x="${(x * step).toFixed(2)}" y="${(y * step).toFixed(2)}"`
           + ` width="${d.toFixed(2)}" height="${d.toFixed(2)}"/>`;
    toggleIcon.innerHTML = s;
    return;
  }
  // 숫자는 배경색으로 뚫어 새긴다
  toggleIcon.innerHTML = `<path d="${BIG_PATH}"/>` +
    `<text x="9" y="9.5" text-anchor="middle" dominant-baseline="central"` +
    ` font-family="Helvetica Neue, sans-serif" font-size="11" font-weight="600"` +
    ` fill="#d9d9d9">${c}</text>`;
}


function setCols(c) {
  cols = c;
  const on = c > 0;
  gridEl.classList.toggle('compact', on);
  if (on) gridEl.style.setProperty('--cols', c);
  const next = nextOf(c);
  drawToggleIcon(c);
  // 실루엣은 뷰와 무관하게 로고 상태 하나로: 사각형이 앞이면 실루엣, 원이 앞이면 입체.
  gridEl.style.setProperty('--sil', squareFront() ? 1 : 0);
  // 열 수는 화면에 표시하지 않는다 — 그리드 자체로 보이므로. 라벨에만 남긴다
  toggleBtn.setAttribute('aria-pressed', on);
  toggleBtn.setAttribute('aria-label',
    (on ? `모아보기 ${c}열` : '큰 보기') +
    (next === 0 ? ', 누르면 큰 보기' : `, 누르면 ${next}열`));
}

// 기본 뷰는 화면 폭과 무관하게 큰 보기 — 최신작을 먼저 보여준다.
setCols(0);

// 상단 아이콘이 작품 이미지에 완전히 덮이는 지점(헤더 높이 + 그리드와의 간격 2rem)을
// 지나야 아래쪽 아이콘이 떠오른다(CSS .scrolled). 덜 덮였는데 사라지면 부자연스럽다.
const headerEl = document.querySelector('header');
addEventListener('scroll', () =>
  headerEl.classList.toggle('scrolled', scrollY > headerEl.offsetHeight + 32),
  {passive: true});

toggleBtn.onclick = () => {
  buzz();
  setCols(nextOf(cols));
  renderGrid();   // 순서는 항상 최신순 — sq/th 변형 교체만을 위해 다시 그린다
};
// label은 button과 달리 키보드 활성화가 없으니 직접 붙인다
document.getElementById('gridToggle').onkeydown = e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.currentTarget.click(); }
};

document.onkeydown = e => {
  if (!isOpen()) return;
  if (e.key === 'Escape') { closeViewer(); return; }
  const v = {ArrowLeft: -1, ArrowRight: 1}[e.key];   // 좌우 = 버전
  if (v) { verTo(v); return; }
  const dir = {ArrowUp: -1, ArrowDown: 1}[e.key];    // 상하 = 작품
  if (dir) slideTo(dir);
};

</script>
</body>
</html>
