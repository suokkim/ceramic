<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동글사각 | CIRCLE SQUARE</title>
<link rel="icon" href="favicon.svg?v=7" type="image/svg+xml">
<!-- 링크 공유 미리보기. og:image 파일명은 optimize.sh가 최신 작품으로 갱신한다 -->
<meta name="description" content="세라믹 도자기 컨셉 디자인 갤러리">
<meta property="og:type" content="website">
<meta property="og:title" content="동글사각 | CIRCLE SQUARE">
<meta property="og:description" content="세라믹 도자기 컨셉 디자인 갤러리">
<meta property="og:url" content="https://suokkim.github.io/ceramic/">
<meta property="og:image" content="https://suokkim.github.io/ceramic/images/05_sculpture_04.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root { color-scheme: light; }
  * { margin: 0; box-sizing: border-box; }
  body {
    font-family: Georgia, "Apple SD Gothic Neo", serif;
    background: #d9d9d9;
    color: #3d3833;
    padding: 3rem 1.5rem;
  }
  header { max-width: 1100px; margin: 0 auto 3rem; text-align: left; }
  .grid {
    max-width: 1100px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 2rem;
  }
  .grid img {
    width: 100%; display: block; cursor: zoom-in;
    filter: brightness(.9); /* 대문에서만 화이트를 살짝 눌러줌, 원본은 그대로 */
    border-radius: 14px; border-top-right-radius: 0; /* 2시 방향만 각짐 */
  }
  footer {
    max-width: 1100px; margin: 4rem auto 0;
    text-align: right;
    font-family: "Helvetica Neue", "Apple SD Gothic Neo", "Pretendard", sans-serif;
    font-weight: 300;
    font-size: .68rem; color: #ededed; letter-spacing: .14em;
  }
  /* 확대 보기: 화면 전체를 덮고, 열려 있는 동안 뒤 페이지는 스크롤 잠금 */
  html:has(dialog[open]) { overflow: hidden; }
  /* vw/dvh 대신 fixed+inset — iOS에서 100vw가 실제 보이는 폭보다 넓게 잡혀
     트랙이 화면을 넘치고 이미지가 한쪽으로 쏠리는 것을 막는다 */
  dialog {
    border: none; outline: none; padding: 0; margin: 0; background: transparent;
    position: fixed; inset: 0; width: auto; height: auto; max-width: none; max-height: none;
    overflow: hidden; overscroll-behavior: contain;
  }
  dialog::backdrop { background: rgba(30,25,20,.85); }
  /* 전체 이미지를 가로로 늘어놓고 브라우저 기본 스크롤 스냅으로 넘긴다.
     손가락 따라오기·관성·스냅이 전부 네이티브라 직접 만든 드래그보다 부드럽다. */
  #track {
    display: flex; width: 100%; height: 100%;
    overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory; overscroll-behavior: contain;
    scrollbar-width: none;
  }
  #track::-webkit-scrollbar { display: none; }
  #track > div { flex: 0 0 100%; scroll-snap-align: center;
    display: flex; align-items: center; justify-content: center; }
  /* 슬라이드 기준 %라서 뷰포트 단위 오차를 타지 않는다 */
  #track img { max-width: 92%; max-height: 92%; display: block; cursor: zoom-out;
    border-radius: 14px; border-top-right-radius: 0; }
</style>
</head>
<body>
<header>
  <svg width="56" height="56" viewBox="0 0 56 56" aria-label="Ceramic">
    <!-- 블랙 사각형 + 회색 원 겹침 (스케치 참고), 외곽선 없음 -->
    <rect x="24" y="8" width="26" height="26" fill="#3a3a3a"/>
    <circle cx="24" cy="30" r="16" fill="#b5b5b5"/>
  </svg>
</header>
<div class="grid" id="grid"></div>
<dialog id="viewer"><div id="track"></div></dialog>
<footer>동글사각&ensp;|&ensp;CIRCLE SQUARE © 2026</footer>
<script>
const viewer = document.getElementById('viewer');
const track = document.getElementById('track');
let n = 0;                        // 실제 이미지 수
const COPIES = 3, MID = 1;        // 세트를 3벌 늘어놓고 가운데(1번) 벌을 기준으로 쓴다

const slide = (src, alt) => {
  // 확대용은 lazy 금지 — 화면 밖 슬라이드가 로드되지 않아 넘기면 빈 화면이 된다.
  // 전부 합쳐 1MB대라 미리 받아도 부담 없고, 썸네일과 같은 파일이라 캐시를 공유한다.
  const div = document.createElement('div');
  const img = new Image();
  img.src = src; img.alt = alt;
  div.appendChild(img);
  return div;
};
const srcOf = name => 'images/' + name;
const altOf = name => name.split('?')[0].replace('.png', '');

fetch('images.json', {cache: 'no-store'}).then(r => r.json()).then(names => {
  const grid = document.getElementById('grid');
  n = names.length;

  names.forEach((name, i) => {
    const thumb = new Image();
    thumb.src = srcOf(name); thumb.alt = altOf(name); thumb.loading = 'lazy';
    thumb.onclick = () => openAt(i);
    grid.appendChild(thumb);
  });

  // 같은 세트를 3벌 이어붙이고 가운데 벌에서 시작한다. 사용자가 트랙 양 끝에 닿을 일이
  // 없으므로 "끝에서 순간이동" 자체가 사라진다 — 사파리가 경계에서 프로그램 스크롤을
  // 무시해 갇히던 문제의 근본 원인이 이것이었다.
  const order = n > 1 ? Array.from({length: COPIES * n}, (_, k) => names[k % n]) : names;
  for (const name of order) track.appendChild(slide(srcOf(name), altOf(name)));
});

const offset = () => (n > 1 ? MID * n : 0);  // 가운데 벌의 시작 슬롯

// 사파리는 다이얼로그가 열린 직후 스냅을 다시 계산하면서 위치를 0으로 되돌릴 때가 있다.
// 그러면 wrap()이 슬롯 0을 보고 마지막 장으로 보내버려 엉뚱한 이미지가 뜬다.
// 그래서 사용자가 트랙을 처음 만지기 전까지는 목표 슬롯을 고수한다 (타이머가 아니라
// "사용자가 손댔는가"가 기준이라 기기·속도와 무관하게 동작한다).
let goal = null;

// 위치 계산은 전부 실제 레이아웃 좌표로 한다. 슬롯 번호에 clientWidth를 곱하면
// 모바일에서 실제 슬라이드 폭과 미세하게 어긋나고, 그 오차가 인덱스에 비례해 커져서
// 어느 지점부터 한 칸씩 밀린 이미지가 뜬다.
const gap = k => {
  const el = track.children[k];
  return el ? el.getBoundingClientRect().left - track.getBoundingClientRect().left : 0;
};
// 스크롤 위치는 엔진에 맡긴다. 직접 더하면 소수점·기기픽셀 반올림이 남아서 이미지가
// 스냅 지점에 정확히 안 붙고 한쪽으로 쏠린 채 멈춘다.
const goToSlot = k => {
  const el = track.children[k];
  if (el) el.scrollIntoView({inline: 'center', block: 'nearest'});
};
const slotNow = () => {
  let best = 0, bestD = Infinity;
  for (let k = 0; k < track.children.length; k++) {
    const d = Math.abs(gap(k));
    if (d < bestD) { bestD = d; best = k; }
  }
  return best;
};

// showModal 먼저 해야 트랙에 폭이 잡혀서 위치 계산이 맞는다.
function openAt(i) {
  viewer.showModal();
  goal = i + offset();
  // goToSlot은 실제 좌표 차이만큼 더하므로 여러 번 불러도 안전하고, 어긋나 있으면 정확히
  // 보정된다. 사파리가 레이아웃·스냅을 몇 프레임에 걸쳐 확정하므로 초반 몇 프레임 찍어둔다.
  hold();
  requestAnimationFrame(hold);
  requestAnimationFrame(() => requestAnimationFrame(hold));
}
function hold() {
  if (goal !== null) goToSlot(goal);
}
const release = () => { goal = null; };   // 사용자가 손대는 순간부터는 자유롭게
for (const ev of ['pointerdown', 'touchstart', 'wheel']) track.addEventListener(ev, release, {passive: true});

// 스크롤이 멎으면 지금 보고 있는 이미지의 "가운데 벌" 위치로 되돌린다. 보이는 그림은
// 그대로라 순간이동이 눈에 띄지 않고, 사용자는 늘 트랙 한복판에 있게 되어 끝에 닿지 않는다.
// 이미 제자리면 정렬만 다시 맞춘다 (한쪽으로 쏠린 채 멈추는 것 교정).
function recenter() {
  if (!viewer.open || !track.clientWidth || n < 2) return;
  if (goal !== null) return hold();   // 아직 사용자가 안 만졌다 = 브라우저가 흔든 것, 되돌린다
  const k = slotNow();
  const to = MID * n + (k % n);
  if (to === k) { goToSlot(to); return; }

  // 사파리는 스냅이 mandatory인 동안 프로그램 스크롤을 되돌려버린다. 옮기는 동안만 끄되,
  // 복원은 같은 함수 안에서 동기로 끝낸다 — rAF나 타이머에 맡기면 그게 안 돌 때
  // 스냅이 꺼진 채로 굳는다. 되켠 순간의 가장 가까운 스냅 지점은 방금 옮겨온 자리다.
  track.style.scrollSnapType = 'none';
  goToSlot(to);
  track.style.scrollSnapType = '';
}
let settle;
const checkRecenter = () => { clearTimeout(settle); settle = setTimeout(recenter, 150); };
track.onscroll = checkRecenter;
track.addEventListener('touchend', checkRecenter);
track.addEventListener('pointerup', checkRecenter);

track.onclick = () => viewer.close();
// 키보드는 즉시 이동. scroll-snap 컨테이너에서는 smooth 스크롤이 아예 동작하지 않는다
// (scrollBy의 behavior 옵션도, CSS scroll-behavior도). 스와이프는 네이티브라 부드럽다.
document.onkeydown = e => {
  if (!viewer.open) return;
  const dir = {ArrowLeft: -1, ArrowRight: 1}[e.key];
  if (dir) { release(); goToSlot(slotNow() + dir); }
};
</script>
</body>
</html>
