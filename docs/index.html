<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동글사각 | CIRCLE SQUARE</title>
<link rel="icon" href="favicon.svg?v=7" type="image/svg+xml">
<style>
  :root { color-scheme: light; }
  * { margin: 0; box-sizing: border-box; }
  body {
    font-family: Georgia, "Apple SD Gothic Neo", serif;
    background: #d9d9d9;
    color: #3d3833;
    padding: 3rem 1.5rem;
  }
  header { max-width: 1100px; margin: 0 auto 3rem; text-align: left; }
  .grid {
    max-width: 1100px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 2rem;
  }
  .grid img {
    width: 100%; display: block; cursor: zoom-in;
    filter: brightness(.9); /* 대문에서만 화이트를 살짝 눌러줌, 원본은 그대로 */
    border-radius: 14px; border-top-right-radius: 0; /* 2시 방향만 각짐 */
  }
  footer {
    max-width: 1100px; margin: 4rem auto 0;
    text-align: right;
    font-family: "Helvetica Neue", "Apple SD Gothic Neo", "Pretendard", sans-serif;
    font-weight: 300;
    font-size: .68rem; color: #ededed; letter-spacing: .14em;
  }
  dialog { border: none; outline: none; padding: 0; margin: auto; background: transparent; max-width: 92vw; max-height: 92vh; }
  dialog img { max-width: 92vw; max-height: 92vh; display: block; cursor: zoom-out;
    border-radius: 14px; border-top-right-radius: 0; }
  dialog::backdrop { background: rgba(30,25,20,.85); }
  dialog button {
    position: fixed; top: 50%; transform: translateY(-50%);
    border: none; background: none; cursor: pointer;
    color: #ededed; font: 300 2.6rem/1 "Helvetica Neue", sans-serif;
    padding: 1rem 1.2rem; opacity: .55;
  }
  dialog button:hover { opacity: 1; }
  #prev { left: 0; }
  #next { right: 0; }
</style>
</head>
<body>
<header>
  <svg width="56" height="56" viewBox="0 0 56 56" aria-label="Ceramic">
    <!-- 블랙 사각형 + 회색 원 겹침 (스케치 참고), 외곽선 없음 -->
    <rect x="24" y="8" width="26" height="26" fill="#3a3a3a"/>
    <circle cx="24" cy="30" r="16" fill="#b5b5b5"/>
  </svg>
</header>
<div class="grid" id="grid"></div>
<dialog id="viewer">
  <img id="viewerImg" alt="">
  <button id="prev" aria-label="이전">‹</button>
  <button id="next" aria-label="다음">›</button>
</dialog>
<footer>동글사각&ensp;|&ensp;CIRCLE SQUARE © 2026</footer>
<script>
const viewer = document.getElementById('viewer');
const viewerImg = document.getElementById('viewerImg');
let srcs = [], idx = 0;

// 역순 정렬된 목록 그대로 ‹ = 이전(왼쪽) 항목, › = 다음(오른쪽) 항목. 양 끝에서 순환.
const show = i => { idx = (i + srcs.length) % srcs.length; viewerImg.src = srcs[idx]; };

fetch('images.json', {cache: 'no-store'}).then(r => r.json()).then(names => {
  const grid = document.getElementById('grid');
  srcs = names.map(n => 'images/' + n);
  names.forEach((name, i) => {
    const img = new Image();
    img.src = srcs[i];
    img.alt = name.split('?')[0].replace('.png', '');
    img.loading = 'lazy';
    img.onclick = () => { show(i); viewer.showModal(); };
    grid.appendChild(img);
  });
});

viewer.onclick = e => { if (e.target === viewer || e.target === viewerImg) viewer.close(); };
document.getElementById('prev').onclick = () => show(idx - 1);
document.getElementById('next').onclick = () => show(idx + 1);
document.onkeydown = e => {
  if (!viewer.open) return;
  if (e.key === 'ArrowLeft') show(idx - 1);
  if (e.key === 'ArrowRight') show(idx + 1);
};
</script>
</body>
</html>
