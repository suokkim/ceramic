<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ceramic — Concept Designs</title>
<link rel="icon" href="favicon.svg?v=7" type="image/svg+xml">
<style>
  :root { color-scheme: light; }
  * { margin: 0; box-sizing: border-box; }
  body {
    font-family: Georgia, "Apple SD Gothic Neo", serif;
    background: #cccccc;
    color: #3d3833;
    padding: 3rem 1.5rem;
  }
  header { max-width: 1100px; margin: 0 auto 3rem; text-align: left; }
  .grid {
    max-width: 1100px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 2rem;
  }
  .grid img {
    width: 100%; display: block; cursor: zoom-in;
  }
  footer {
    max-width: 1100px; margin: 4rem auto 0;
    text-align: right;
    font-family: "Helvetica Neue", "Apple SD Gothic Neo", "Pretendard", sans-serif;
    font-weight: 300;
    font-size: .8rem; color: #ffffff; letter-spacing: .14em;
  }
  dialog { border: none; outline: none; padding: 0; margin: auto; background: transparent; max-width: 92vw; max-height: 92vh; }
  dialog img { max-width: 92vw; max-height: 92vh; display: block; cursor: zoom-out; }
  dialog::backdrop { background: rgba(30,25,20,.85); }
</style>
</head>
<body>
<header>
  <svg width="56" height="56" viewBox="0 0 56 56" aria-label="Ceramic">
    <!-- 블랙 사각형 + 회색 원 겹침 (스케치 참고), 외곽선 없음 -->
    <rect x="24" y="8" width="26" height="26" fill="#3a3a3a"/>
    <circle cx="24" cy="30" r="16" fill="#b5b5b5"/>
  </svg>
</header>
<div class="grid" id="grid"></div>
<dialog id="viewer"><img id="viewerImg" alt=""></dialog>
<footer>둥글뽀족 © 2026</footer>
<script>
fetch('images.json').then(r => r.json()).then(names => {
  const grid = document.getElementById('grid');
  for (const name of names) {
    const img = new Image();
    img.src = 'images/' + name;
    img.alt = name.replace('.png', '');
    img.loading = 'lazy';
    img.onclick = () => {
      document.getElementById('viewerImg').src = img.src;
      document.getElementById('viewer').showModal();
    };
    grid.appendChild(img);
  }
});
document.getElementById('viewer').onclick = e => e.currentTarget.close();
</script>
</body>
</html>
