<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동글사각 | CIRCLE SQUARE</title>
<link rel="icon" href="favicon.svg?v=7" type="image/svg+xml">
<!-- 링크 공유 미리보기. og:image 파일명은 optimize.sh가 최신 작품으로 갱신한다 -->
<meta name="description" content="세라믹 도자기 컨셉 디자인 갤러리">
<meta property="og:type" content="website">
<meta property="og:title" content="동글사각 | CIRCLE SQUARE">
<meta property="og:description" content="세라믹 도자기 컨셉 디자인 갤러리">
<meta property="og:url" content="https://suokkim.github.io/ceramic/">
<meta property="og:image" content="https://suokkim.github.io/ceramic/images/05_sculpture_04.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root { color-scheme: light; }
  * { margin: 0; box-sizing: border-box; }
  body {
    font-family: Georgia, "Apple SD Gothic Neo", serif;
    background: #d9d9d9;
    color: #3d3833;
    padding: 3rem 1.5rem;
  }
  header { max-width: 1100px; margin: 0 auto 3rem; text-align: left; }
  .grid {
    max-width: 1100px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 2rem;
  }
  .grid img {
    width: 100%; display: block; cursor: zoom-in;
    filter: brightness(.9); /* 대문에서만 화이트를 살짝 눌러줌, 원본은 그대로 */
    border-radius: 14px; border-top-right-radius: 0; /* 2시 방향만 각짐 */
  }
  footer {
    max-width: 1100px; margin: 4rem auto 0;
    text-align: right;
    font-family: "Helvetica Neue", "Apple SD Gothic Neo", "Pretendard", sans-serif;
    font-weight: 300;
    font-size: .68rem; color: #ededed; letter-spacing: .14em;
  }
  /* 확대 보기: 화면 전체를 덮고, 열려 있는 동안 뒤 페이지는 스크롤 잠금.
     iOS는 overflow:hidden만으로 터치 스크롤이 안 막혀서 JS에서 body를 fixed로도 잠근다 */
  html:has(dialog[open]) { overflow: hidden; }
  /* vw/dvh 대신 fixed+inset — iOS에서 100vw가 실제 보이는 폭보다 넓게 잡혀
     트랙이 화면을 넘치고 이미지가 한쪽으로 쏠리는 것을 막는다 */
  dialog {
    border: none; outline: none; padding: 0; margin: 0; background: transparent;
    position: fixed; inset: 0; width: auto; height: auto; max-width: none; max-height: none;
    overflow: hidden; overscroll-behavior: contain;
  }
  dialog::backdrop { background: rgba(30,25,20,.85); }
  /* 열릴 때: 배경은 잦아들듯, 이미지는 살짝 아래에서 떠오르듯.
     transform은 img에만 건다 — 트랙·슬라이드에 걸면 좌표 계산(gap/scrollIntoView)이 틀어진다 */
  dialog[open] { animation: fadeIn .32s ease; }
  dialog[open]::backdrop { animation: fadeIn .32s ease; }
  /* 배경보다 반 박자 늦게, 짧은 거리를 길게 감속하며 떠오른다.
     .pop(지금 보이는 한 장)에만 건다 — 45장 전부에 걸면 transform이 이미지마다 GPU
     레이어를 만들어 iOS가 메모리 스파이크로 화면째 죽는다(어두워지며 먹통).
     키프레임에 opacity 금지 — 애니메이션이 멈추면 backwards 채움 탓에 투명하게 갇힌다. */
  dialog[open] #track img.pop { animation: rise .55s .05s cubic-bezier(.16,1,.3,1) backwards; }
  @keyframes fadeIn { from { opacity: 0; } }
  @keyframes rise { from { transform: translateY(10px) scale(.985); } }
  @media (prefers-reduced-motion: reduce) {
    dialog[open], dialog[open]::backdrop, dialog[open] #track img.pop { animation: none; }
  }
  /* 3장(이전·현재·다음)만 들고 transform으로 넘기는 페이저. 스크롤을 아예 쓰지 않는다 —
     iOS의 스크롤 스냅은 프로그램 스크롤 무시·재스냅·경계 고착 등 문제가 많아 전부 걷어냈다. */
  #track {
    display: flex; width: 100%; height: 100%;
    transform: translateX(-100%);
    touch-action: none; /* 제스처는 전부 JS가 처리, 배경은 어차피 잠겨 있다 */
  }
  #track > div { flex: 0 0 100%;
    display: flex; align-items: center; justify-content: center; }
  /* 슬라이드 기준 %라서 뷰포트 단위 오차를 타지 않는다 */
  #track img { max-width: 92%; max-height: 92%; display: block; cursor: zoom-out;
    border-radius: 14px; border-top-right-radius: 0;
    -webkit-user-drag: none; user-select: none; }
</style>
</head>
<body>
<header>
  <svg width="56" height="56" viewBox="0 0 56 56" aria-label="Ceramic">
    <!-- 블랙 사각형 + 회색 원 겹침 (스케치 참고), 외곽선 없음 -->
    <rect x="24" y="8" width="26" height="26" fill="#3a3a3a"/>
    <circle cx="24" cy="30" r="16" fill="#b5b5b5"/>
  </svg>
</header>
<div class="grid" id="grid"></div>
<dialog id="viewer"><div id="track"></div></dialog>
<!-- 푸터 끝 b숫자 = 배포 버전 표식. GitHub Pages가 HTML을 10분 캐시하므로
     폰에서 어떤 버전을 보고 있는지 이걸로 확인한다. 배포마다 1씩 올릴 것. -->
<footer>동글사각&ensp;|&ensp;CIRCLE SQUARE © 2026&ensp;·&ensp;b24</footer>
<script>
const viewer = document.getElementById('viewer');
const track = document.getElementById('track');
let names = [], n = 0, cur = 0;   // cur = 지금 보이는 이미지 인덱스

const srcOf = name => 'images/' + name;
const altOf = name => name.split('?')[0].replace('.png', '');

// 슬라이드는 딱 3장: [이전, 현재, 다음]. 트랙은 늘 가운데(-100%)를 보여준다.
const slides = [0, 1, 2].map(() => {
  const div = document.createElement('div');
  div.appendChild(new Image());
  track.appendChild(div);
  return div.firstElementChild;
});
slides[1].classList.add('pop');   // 열림 애니메이션은 항상 가운데 장에만

// 현재 인덱스 기준으로 3장의 내용을 채운다
function show() {
  if (!n) return;
  [(cur - 1 + n) % n, cur, (cur + 1) % n].forEach((idx, j) => {
    const name = names[idx];
    if (slides[j].getAttribute('src') !== srcOf(name)) {
      slides[j].src = srcOf(name);
      slides[j].alt = altOf(name);
    }
  });
}

const setX = (px, animate) => {
  track.style.transition = animate ? 'transform .3s cubic-bezier(.2,.7,.3,1)' : 'none';
  track.style.transform = `translateX(calc(-100% + ${px}px))`;
};

// dir: -1 이전 / +1 다음 / 0 제자리 복귀. 확정은 transitionend가 아니라 타이머로 —
// transitionend는 유실될 수 있고(예전에 그걸로 뷰어가 영구히 잠겼다) 타이머는 반드시 돈다.
let animating = false;
function slideTo(dir) {
  if (animating || !n) return;
  if (!dir || n < 2) { setX(0, true); return; }
  animating = true;
  track.style.transition = 'transform .3s cubic-bezier(.2,.7,.3,1)';
  track.style.transform = `translateX(${-100 - dir * 100}%)`;
  setTimeout(() => {
    cur = ((cur + dir) % n + n) % n;
    show();
    setX(0, false);
    animating = false;
  }, 320);
}

fetch('images.json', {cache: 'no-store'}).then(r => r.json()).then(list => {
  names = list; n = list.length;
  const grid = document.getElementById('grid');
  list.forEach((name, i) => {
    const thumb = new Image();
    thumb.src = srcOf(name); thumb.alt = altOf(name); thumb.loading = 'lazy';
    thumb.onclick = () => openAt(i);
    grid.appendChild(thumb);
  });
});

// iOS는 overflow:hidden으로 터치 스크롤이 안 막힌다. 열려 있는 동안 body를 fixed로
// 못 박는 것이 유일하게 확실한 잠금. 닫을 때 스크롤 위치를 되돌린다.
let pageY = 0;
const lockPage = () => {
  pageY = scrollY;
  document.body.style.cssText = `position:fixed; top:${-pageY}px; left:0; right:0;`;
};
const unlockPage = () => {
  document.body.style.cssText = '';
  scrollTo(0, pageY);
};
// 닫기는 어떤 경로든 unlock을 거친다. close 이벤트 리스너는 Esc 등 나머지 경로용 보조.
const closeViewer = () => { unlockPage(); viewer.close(); };
viewer.addEventListener('close', unlockPage);

// 스크롤이 없으니 "열면 그 이미지"가 자명하다 — 위치 계산도, 고정도, 재정렬도 필요 없다.
function openAt(i) {
  lockPage();
  cur = i;
  show();
  setX(0, false);
  viewer.showModal();
}

// 드래그: 손가락/마우스를 따라가고, 놓을 때 충분히 밀었으면 넘기고 아니면 복귀.
let x0 = 0, dx = 0, down = false, dragging = false;
track.addEventListener('pointerdown', e => {
  if (animating || e.button) return;
  down = true; dragging = false; dx = 0; x0 = e.clientX;
  try { track.setPointerCapture(e.pointerId); } catch {}
});
track.addEventListener('pointermove', e => {
  if (!down) return;
  dx = e.clientX - x0;
  if (!dragging && Math.abs(dx) > 6) dragging = true;
  if (dragging) setX(dx, false);
});
const endDrag = () => {
  if (!down) return;
  down = false;
  if (!dragging) return;   // 드래그가 아니면 click 핸들러가 닫기를 처리
  const w = track.clientWidth || innerWidth;
  slideTo(Math.abs(dx) > Math.min(90, w / 5) ? (dx < 0 ? 1 : -1) : 0);
};
track.addEventListener('pointerup', endDrag);
track.addEventListener('pointercancel', endDrag);

track.onclick = () => { if (!dragging) closeViewer(); dragging = false; };

// 트랙패드 두 손가락 스와이프: 관성 이벤트가 계속 오므로 한 제스처당 한 번만
let wheelLock = false, wheelT = 0;
track.addEventListener('wheel', e => {
  if (Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
  e.preventDefault();
  clearTimeout(wheelT); wheelT = setTimeout(() => { wheelLock = false; }, 250);
  if (wheelLock || Math.abs(e.deltaX) < 25) return;
  wheelLock = true;
  slideTo(e.deltaX > 0 ? 1 : -1);
}, {passive: false});

document.onkeydown = e => {
  if (!viewer.open) return;
  const dir = {ArrowLeft: -1, ArrowRight: 1}[e.key];
  if (dir) slideTo(dir);
};
</script>
</body>
</html>
